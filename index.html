<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#242526" />
    <meta
      name="description"
      content="CronBase — Self-hosted TypeScript script scheduler with per-project SQLite databases and environment variables."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CronBase</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("cronbase.theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", theme === "dark" ? "#242526" : "#fafafd");
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
